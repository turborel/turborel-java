# The build is cached and its configuration reused between runs.
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# JDKs are found on the machine, never downloaded by the build: install
# JDK 17 and JDK 21 (RULES.md D10), or name their homes with
# -Dorg.gradle.java.installations.paths=<jdk17>,<jdk21>.
org.gradle.java.installations.auto-download=false
