- name: "area/statements"
  color: "#c5def5"
  description: "internal/statements/: queries, prepared statements, cursors"
- name: "area/lobs"
  color: "#c5def5"
  description: "internal/lobs/: large objects by locator"
- name: "area/copy"
  color: "#c5def5"
  description: "internal/copy/: copy, import and export"
- name: "area/settings"
  color: "#c5def5"
  description: "internal/settings/: the URI, service and password files, hosts"
- name: "area/pipeline"
  color: "#c5def5"
  description: "internal/pipeline/"
- name: "area/pool"
  color: "#c5def5"
  description: "internal/pool/"
- name: "area/api"
  color: "#c5def5"
  description: "The JDBC API, com/turborel/jdbc/, and module-info.java"
- name: "area/doc"
  color: "#c5def5"
  description: "doc/, README.md, RULES.md, CONFORMANCE.md, TODO.md, AGENTS.md, CONTRIBUTING.md"
- name: "area/ci"
  color: "#c5def5"
  description: "The workflows, issue forms and labels in .github/, and .githooks/"
- name: "area/build"
  color: "#c5def5"
