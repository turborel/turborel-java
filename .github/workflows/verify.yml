# Every check a change must pass (RULES.md R-PROC-1), on each platform the
# driver runs on (R-PLAT-1) and each Java release it supports (D3), plus the
# coverage floor (R-COV-1). JDK 17 compiles the library, JDK 21 runs Error
# Prone and Checkstyle (D4), and the matrix's JDK runs the tests.
name: verify

# A pull request is checked once, through pull_request, and main again once
# it is merged. Pushing a branch with an open pull request starts no second
# set of the same checks.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its checks still running. On main
# every merge is checked to the end.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 21, 25]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JDK 17, which compiles the library
        id: jdk17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - name: JDK 21, which runs Error Prone and Checkstyle
        id: jdk21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: JDK ${{ matrix.java }}, which runs the tests
        id: jdk
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Gradle, its wrapper validated
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Every check
        shell: bash
        timeout-minutes: 30
        run: >-
          ./gradlew check -PtestJava=${{ matrix.java }}
          "-Dorg.gradle.java.installations.paths=${{ steps.jdk17.outputs.path }},${{ steps.jdk21.outputs.path }},${{ steps.jdk.outputs.path }}"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JDK 17, which compiles and tests the library
        id: jdk17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle, its wrapper validated
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Coverage and its floor
        run: >-
          ./gradlew jacocoTestReport jacocoTestCoverageVerification
          "-Dorg.gradle.java.installations.paths=${{ steps.jdk17.outputs.path }}"
      - name: The coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: build/reports/jacoco/test/
