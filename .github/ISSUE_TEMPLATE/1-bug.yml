name: Bug
description: The driver fails, crashes, hangs, or reads or sends a wrong value.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Try the latest `main` first, and search the issues: add to one that matches.
        A vulnerability is never reported here: see SECURITY.md.
        Put a severe impact first in the title: `[WRONG RESULT]`, `[CRASH]` or `[REGRESSION]`.
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: The impact first, in a short paragraph. Then one sentence that sums it up.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Wrong value read or sent
        - An exception other than TurborelException, a JVM crash, or a hang
        - Wrong SQLCODE, SQLSTATE or message
        - Connection refused or lost when it should not be
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The smallest program that shows it, and the statements it runs from an empty database: the schema, the data and the calls.
        Say how it connects: TCP, a Unix socket or a named pipe; TLS or not; the mechanism; the settings.
      render: java
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, and why. Cite the protocol's section or turborel-client's behaviour if it says, e.g. `[PROTOCOL The tail]`.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead. Give the SQLCODE, SQLSTATE and message, and the stack trace if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If it worked before, give the last good commit and, if you ran `git bisect`, the first bad one.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
  - type: input
    id: jdk
    attributes:
      label: JDK
      description: Its vendor and version, as `java -version` prints them, and whether the driver ran on the module path or the class path.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The operating system and version, and the architecture, e.g. "Ubuntu 24.04, x86_64".
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: turborel server
      description: The server's release, as `turboreld --version` prints it, and the commit it was built from if not a release.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Logs, how often it happens, what you ruled out.
