name: Feature
description: Something the driver should do that it does not.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Check TODO.md and CONFORMANCE.md first: it may be planned already.
        The driver's scope is turborel-client's features, the protocol, and JDBC 4.3 over them. A feature of the protocol or of turborel-client is cited by its section; something beyond them is agreed in turborel first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you need to do, and why the driver cannot do it today, or not well.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - JDBC 4.3 the driver does not implement
        - A protocol feature or capability
        - A turborel-client feature
        - A GUI tool or framework that cannot use the driver
        - Settings or configuration
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: |
        For JDBC: the interface and methods, from JDBC 4.3.
        For the protocol or turborel-client: the section, e.g. "[PROTOCOL Capabilities]" or "[CLIENT Pools]".
        For anything else: how it would work, and the API or settings it would add.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else would solve the problem, and why this is better.
