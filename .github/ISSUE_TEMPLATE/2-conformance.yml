name: Conformance
description: The driver departs from the protocol spec or from turborel-client.
labels: ["conformance"]
body:
  - type: markdown
    attributes:
      value: |
        Check CONFORMANCE.md first: a row marked "not yet" is not a departure, it is open work.
        The protocol is turborel's doc/client/05-protocol.md; turborel-client's behaviour is its doc/client/02-library.md and 02-library-connections.md, and its code. Where the page and the code differ, the code is right.
  - type: dropdown
    id: reference
    attributes:
      label: Departs from
      options:
        - The protocol spec (05-protocol.md)
        - turborel-client (02-library.md, 02-library-connections.md, or its code)
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: The section
      description: Its heading, as printed, e.g. "The tail", "Pipelines", and the CONFORMANCE.md row.
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What it says
      description: Quote the passage, or name turborel-client's function and what it does.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Program
      description: The smallest program that shows the departure, and the statements it runs from an empty database.
      render: java
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the spec or turborel-client does
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What the driver does
      description: Its result, or its SQLCODE, SQLSTATE and message, or the bytes it sent.
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`, and the turborel server's release"
    validations:
      required: true
